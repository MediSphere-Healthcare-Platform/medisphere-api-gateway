server:
  port: 8080

spring:
  application:
    name: medisphere-api-gateway
  security:
    user:
      name: admin
      password: password123
  cloud:
    gateway:

          - id: patient-actuator
            uri: http://patient-service:8084
            predicates:
              - Path=/patient/actuator/**
            filters:
              - RewritePath=/patient/(?<remaining>.*), /${remaining}
          - id: patient-service
            uri: http://patient-service:8084
            predicates:
              - Path=/patient/**
            filters:
              - RewritePath=/patient/(?<remaining>.*), /${remaining}

          - id: doctor-actuator
            uri: http://doctor-service:8085
            predicates:
              - Path=/doctor/actuator/**
            filters:
              - RewritePath=/doctor/(?<remaining>.*), /${remaining}
          - id: doctor-service
            uri: http://doctor-service:8085
            predicates:
              - Path=/doctor/**
            filters:
              - RewritePath=/doctor/(?<remaining>.*), /${remaining}

          - id: telemedicine-actuator
            uri: http://telemedicine-service:8086
            predicates:
              - Path=/telemedicine/actuator/**
            filters:
              - RewritePath=/telemedicine/(?<remaining>.*), /${remaining}
          - id: telemedicine-service
            uri: http://telemedicine-service:8086
            predicates:
              - Path=/telemedicine/**
            filters:
              - RewritePath=/telemedicine/(?<remaining>.*), /${remaining}

          - id: notification-actuator
            uri: http://notification-service:8087
            predicates:
              - Path=/notification/actuator/**
            filters:
              - RewritePath=/notification/(?<remaining>.*), /${remaining}
          - id: notification-service
            uri: http://notification-service:8087
            predicates:
              - Path=/notification/**
            filters:
              - RewritePath=/notification/(?<remaining>.*), /${remaining}

          - id: ai-symptom-actuator
            uri: http://aisymptomcheck-service:8088
            predicates:
              - Path=/ai-symptom/actuator/**
            filters:
              - RewritePath=/ai-symptom/(?<remaining>.*), /${remaining}
          - id: ai-symptom-service
            uri: http://aisymptomcheck-service:8088
            predicates:
              - Path=/ai-symptom/**
            filters:
              - RewritePath=/ai-symptom/(?<remaining>.*), /${remaining}

          - id: admin-actuator
            uri: http://admin-service:8089
            predicates:
              - Path=/admin/actuator/**
            filters:
              - RewritePath=/admin/(?<remaining>.*), /${remaining}
          - id: admin-service
            uri: http://admin-service:8089
            predicates:
              - Path=/admin/**
            filters:
              - RewritePath=/admin/(?<remaining>.*), /${remaining}

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.web: DEBUG
    org.apache.catalina: INFO
