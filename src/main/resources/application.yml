server:
  port: 8080

spring:
  application:
    name: medisphere-api-gateway
  security:
    user:
      name: admin
      password: password123
  cloud:
    gateway:
      mvc:
        routes:
          - id: appointment-service
            uri: http://appointment-service:8081
            predicates:
              - Path=/appointment/**
            filters:
              - RewritePath=/appointment/(?<remaining>.*), /api/v1/${remaining}

          - id: payment-service
            uri: http://payment-service:8082
            predicates:
              - Path=/payment/**
            filters:
              - RewritePath=/payment/(?<remaining>.*), /api/v1/${remaining}

          - id: auth-service
            uri: http://auth-service:8083
            predicates:
              - Path=/auth/**
            filters:
              - RewritePath=/auth/(?<remaining>.*), /api/v1/${remaining}

          - id: patient-service
            uri: http://patient-service:8084
            predicates:
              - Path=/patient/**
            filters:
              - RewritePath=/patient/(?<remaining>.*), /${remaining}

          - id: doctor-service
            uri: http://doctor-service:8085
            predicates:
              - Path=/doctor/**
            filters:
              - RewritePath=/doctor/(?<remaining>.*), /${remaining}

          - id: telemedicine-service
            uri: http://telemedicine-service:8086
            predicates:
              - Path=/telemedicine/**
            filters:
              - RewritePath=/telemedicine/(?<remaining>.*), /${remaining}

          - id: notification-service
            uri: http://notification-service:8087
            predicates:
              - Path=/notification/**
            filters:
              - RewritePath=/notification/(?<remaining>.*), /${remaining}

          - id: ai-symptom-service
            uri: http://aisymptomcheck-service:8088
            predicates:
              - Path=/ai-symptom/**
            filters:
              - RewritePath=/ai-symptom/(?<remaining>.*), /${remaining}

          - id: admin-service
            uri: http://admin-service:8089
            predicates:
              - Path=/admin/**
            filters:
              - RewritePath=/admin/(?<remaining>.*), /${remaining}

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.web: DEBUG
    org.apache.catalina: INFO
