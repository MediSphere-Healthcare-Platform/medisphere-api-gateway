server:
  port: 8080

spring:
  main:
    web-application-type: reactive
  application:
    name: medisphere-api-gateway
  security:
    user:
      name: admin
      password: password123
  cloud:
    gateway:
      routes:
        - id: appointment-service
          uri: http://appointment-service:8081
          predicates:
            - Path=/appointment/**
          filters:
            - RewritePath=/appointment/(?<remaining>.*), /api/v1/${remaining}
        - id: payment-service
          uri: http://payment-service:8082
          predicates:
            - Path=/payment/**
          filters:
            - RewritePath=/payment/(?<remaining>.*), /api/v1/${remaining}
        - id: auth-service
          uri: http://auth-service:8083
          predicates:
            - Path=/auth/**
          filters:
            - RewritePath=/auth/(?<remaining>.*), /api/v1/${remaining}

eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka-server:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
