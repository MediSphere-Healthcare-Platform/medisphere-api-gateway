server:
  port: 8080

spring:
  main:
    web-application-type: reactive

  application:
    name: medisphere-api-gateway

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:3000"
            allowedMethods:
              - "*"
            allowedHeaders: "*"
            allowCredentials: true
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin, RETAIN_FIRST
      routes:
        # ================= TELEMEDICINE (HIGHEST PRIORITY) =================
        - id: medisphere-telemedicine-service-doctors
          uri: lb://medisphere-telemedicine-service
          predicates:
            - Path=/api/doctors,/api/doctors/

        - id: medisphere-telemedicine-service-sessions
          uri: lb://medisphere-telemedicine-service
          predicates:
            - Path=/api/sessions/**

        - id: medisphere-telemedicine-service-prescriptions
          uri: lb://medisphere-telemedicine-service
          predicates:
            - Path=/api/prescriptions/**

        # ================= AUTH =================
        - id: auth-service
          uri: lb://medisphere-auth-service
          predicates:
            - Path=/api/auth/**
          filters:
            - RewritePath=/api/auth/(?<segment>.*), /api/v1/auth/${segment}

        # ================= APPOINTMENT =================
        - id: appointment-service
          uri: lb://medisphere-appointment-service
          predicates:
            - Path=/api/appointments/**
          filters:
            - RewritePath=/api/appointments/(?<segment>.*), /api/v1/appointments/${segment}

        # ================= PAYMENT =================
        - id: payment-service
          uri: lb://medisphere-payment-service
          predicates:
            - Path=/api/payment/**
          filters:
            - RewritePath=/api/payment/(?<segment>.*), /api/v1/payment/${segment}

        # ================= PATIENT =================
        - id: patient-service
          uri: lb://medisphere-patient-service
          predicates:
            - Path=/api/patients/**
          filters:
            - RewritePath=/api/patients/(?<segment>.*), /patient/api/v1/${segment}

        # ================= DOCTOR =================
        - id: doctor-service
          uri: lb://medisphere-doctor-service
          predicates:
            - Path=/api/doctors/**
          filters:
            - RewritePath=/api/doctors/(?<segment>.*), /doctor/api/v1/${segment}

        # ================= NOTIFICATION =================
        - id: notification-service
          uri: lb://medisphere-notification-service
          predicates:
            - Path=/api/notifications/**
          filters:
            - RewritePath=/api/notifications/(?<segment>.*), /api/v1/notifications/${segment}

        # ================= ADMIN =================
        - id: admin-service
          uri: lb://medisphere-admin-service
          predicates:
            - Path=/api/admin/**
          filters:
            - RewritePath=/api/admin/(?<segment>.*), /api/v1/admin/${segment}

        # ================= AI SYMPTOM CHECKER =================
        - id: medisphere-AIsymptomcheck-service
          uri: lb://medisphere-AIsymptomcheck-service
          predicates:
            - Path=/api/symptoms/**
          filters:
            - RewritePath=/api/symptoms/(?<segment>.*), /api/symptoms/${segment}

gateway:
  whitelist-urls:
    - /api/auth/register/patient
    - /api/auth/register/doctor
    - /api/auth/login
    - /api/admin/doctors/pending
    - /eureka

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    org.springframework.cloud.gateway: TRACE